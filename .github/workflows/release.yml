name: Trusted release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Validate version tag
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" == "$GITHUB_SHA" ]]
      - name: Install application and test dependencies
        run: |
          python -m venv .venv
          python -m pip install --requirement requirements.txt
          python -m pip install --requirement requirements-test.txt
      - name: Validate application
        run: |
          python -m pytest -q
          git diff --check
      - name: Assemble verified release
        run: |
          scripts/release/build-archive.sh "$GITHUB_REF_NAME" release
          scripts/release/verify-release.sh "$GITHUB_REF_NAME" release
      - name: Attest final archive
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release/noc-web-${{ github.ref_name }}.tar.gz
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/noc-web-${GITHUB_REF_NAME}.tar.gz release/noc-web-${GITHUB_REF_NAME}.sha256 --title "$GITHUB_REF_NAME"
